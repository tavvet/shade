name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build .app bundle
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Build Shade.app (ad-hoc signed)
        run: make build

      - name: Build Shade.dmg
        run: make dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Shade.dmg
          path: build/Shade.dmg
          if-no-files-found: error

  release:
    name: Attach build to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Shade.dmg
          path: ./artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/Shade.dmg
          draft: true
          generate_release_notes: true
